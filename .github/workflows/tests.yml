name: Tests

on:
  # INVARIANT: the pull_request trigger carries NO path filter. Do not add one.
  #
  # Branch protection on main requires five contexts, and every one of them is
  # produced by a job in this file: "PR Title (Conventional Commits)", "Lint
  # (conventions, SwiftLint, SwiftFormat, ShellCheck)", "APITypes Build (SPM)",
  # "Test (build + unit + snapshots + warnings)" and "Swift Conventions
  # (ast-grep)". A path filter that excludes a change set creates no workflow
  # run at all, so those five contexts never report and sit "Expected"
  # forever. Per GitHub: "If a workflow is skipped due to path filtering [...]
  # then checks associated with that workflow will remain in a 'Pending'
  # state. A pull request that requires those checks to be successful will be
  # blocked from merging."
  #
  # The allowlist this replaces made that unmergeable state reachable three
  # ways. It excluded root markdown, so PR #91 (README.md + CLAUDE.md) could
  # never merge. It also omitted DownloadActivityWidget/** and
  # NotificationServiceExtension/**, two real Xcode targets, so a change to
  # either produced no run, no verification and no way to merge.
  #
  # Do NOT repair this by adding a second workflow that mirrors these five job
  # names for the excluded paths. GitHub rules that shape out: "make sure that
  # job names are unique across all workflows. Using the same job name in
  # multiple workflows can cause ambiguous status check results and block pull
  # requests from being merged." Two triggers also cannot be made
  # complementary, because paths-ignore runs a workflow when ANY changed file
  # falls outside the ignore list. A mixed pull request (code plus a README)
  # therefore fires both workflows, duplicate names resolve latest-wins, and a
  # no-op twin can mask a real failure.
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    # A denylist, not an allowlist. An allowlist rots dangerously: a new source
    # directory escapes CI silently, which is exactly how the two targets above
    # went unverified. A denylist rots safely, because an unlisted path runs the
    # suite. Markdown is the only entry, and it is the only safe one: no job
    # below reads a .md file. The five checks run swiftlint, swiftformat,
    # shellcheck over Scripts/*.sh, xcodebuild and ast-grep, and none of them
    # parse markdown. Keep this list to paths with that same property.
    #
    # Spell it '**/*.md', not '**.md'. The leading '**/' collapses to zero
    # directories, so the one pattern covers README.md at the root and every
    # nested .md. The shorter '**.md' form is documented as recursive but has
    # been observed matching root-level files only (github/docs issue #24132).
    paths-ignore:
      - '**/*.md'

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SCHEME: OfflineMediaDownloader
  PROJECT: OfflineMediaDownloader.xcodeproj

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, arm64, base]
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            test
            style
            ci
            docs
            perf
            revert
            deps

  lint:
    name: Lint (conventions, SwiftLint, SwiftFormat, ShellCheck)
    runs-on: [self-hosted, linux, arm64, swift-lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: Lint (conventions, SwiftLint, SwiftFormat, ShellCheck)
        run: |
          bash Scripts/validate-ios-version.sh
          bash Scripts/validate-tca-patterns.sh
          swiftlint lint --reporter github-actions-logging
          swiftformat --lint .
          shellcheck Scripts/*.sh

  apitypes-build:
    name: APITypes Build (SPM)
    needs: lint
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-xcode-env
        with:
          discover_simulator: 'false'
      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: APITypes Build (SPM)
        run: xcrun swift build --package-path APITypes --disable-sandbox

  test:
    name: Test (build + unit + snapshots + warnings)
    needs: lint
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 45
    env:
      SNAPSHOT_TESTING_RECORD: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone design-system-Lifegames as sibling of workspace
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Packages/OMDFeatures/Package.swift references the DS via the relative
          # path ../../../design-system-Lifegames, which resolves to a sibling of
          # the OMD repo root. actions/checkout cannot write outside
          # $GITHUB_WORKSPACE, so clone the DS there with raw git so SPM can find
          # it. For coordinated cross-repo PRs, prefer a same-named DS branch if it
          # exists; otherwise fall back to main (mirrors ios-LifegamesPortal CI).
          DS_REPO_URL=https://github.com/j0nathan-ll0yd/design-system-Lifegames.git
          DS_DIR="$(dirname "$GITHUB_WORKSPACE")/design-system-Lifegames"
          DS_REF=main
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ]; then
            if git ls-remote --exit-code "$DS_REPO_URL" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
              DS_REF="$HEAD_REF"
              echo "Using matching DS branch: $DS_REF"
            else
              echo "No matching DS branch for '$HEAD_REF'; falling back to main"
            fi
          fi
          if [ -d "$DS_DIR/.git" ]; then
            git -C "$DS_DIR" fetch --depth 1 origin "$DS_REF"
            git -C "$DS_DIR" reset --hard FETCH_HEAD
          else
            rm -rf "$DS_DIR"
            git clone --depth 1 --branch "$DS_REF" "$DS_REPO_URL" "$DS_DIR"
          fi
          ls -la "$DS_DIR" | head -5

      - uses: ./.github/actions/setup-xcode-env
        id: env

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-cache-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            spm-cache-${{ runner.os }}-

      - uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f  # v1.9.2
        with:
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('**/*.pbxproj', '**/Package.resolved', '**/Package.swift', 'Development.xcconfig') }}
          restore-keys: |
            xcode-deriveddata-${{ runner.os }}-

      - name: Boot simulator
        run: |
          DEVICE_ID="${{ steps.env.outputs.device_id }}"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          for i in {1..30}; do
            if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "Booted"; then
              echo "Simulator ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.env.outputs.device_id }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | { xcbeautify --report junit --report-path build-results.xml || cat; }

      - name: Check build warnings
        run: bash Scripts/check-build-warnings.sh

      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: Test (build + unit + snapshots + warnings)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.env.outputs.device_id }}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            -parallel-testing-enabled YES \
            -only-testing:OfflineMediaDownloaderTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | { xcbeautify --report junit --report-path test-results.xml || cat; }

      - name: Run PreviewFixtures package tests (S98)
        working-directory: Packages/OMDFeatures
        run: |
          # The app scheme's Testables only include the app test bundles, so
          # SPM package test targets don't run above. This executes every
          # fixture accessor so a design-system fixture/decode regression
          # fails CI instead of crashing previews (S98).
          set -o pipefail
          xcodebuild test \
            -scheme OMDFeatures-Package \
            -destination "id=${{ steps.env.outputs.device_id }}" \
            -only-testing:PreviewFixturesTests \
            -parallel-testing-enabled YES \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee package-test.log | { xcbeautify || cat; }

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test-results.xml
            build-results.xml
          retention-days: 7

      - name: Upload snapshot failures (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snapshot-failures
          path: |
            **/__Snapshots__/**/*.png
            **/*.diff.png
          retention-days: 3

      - name: Test Summary
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TESTS=$(grep -o 'tests="[0-9]*"' test-results.xml 2>/dev/null | head -1 | grep -o '[0-9]*' || echo "0")
            FAILURES=$(grep -o 'failures="[0-9]*"' test-results.xml 2>/dev/null | head -1 | grep -o '[0-9]*' || echo "0")
            if [ -z "$TESTS" ]; then TESTS="0"; fi
            if [ -z "$FAILURES" ]; then FAILURES="0"; fi
            if [ "$FAILURES" = "0" ]; then
              echo "All $TESTS tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "$FAILURES of $TESTS tests failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

  release-build:
    name: Release Archive (no codesign)
    needs: test
    runs-on: [self-hosted, macOS, arm64, xcode-26]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone design-system-Lifegames as sibling of workspace
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # The Release archive builds the app, which depends on the DS via the
          # relative path ../../../design-system-Lifegames (a sibling of the OMD
          # repo root). actions/checkout cannot write outside $GITHUB_WORKSPACE,
          # so clone the DS there with raw git; prefer a same-named DS branch for
          # coordinated PRs, else fall back to main (mirrors the test job above).
          DS_REPO_URL=https://github.com/j0nathan-ll0yd/design-system-Lifegames.git
          DS_DIR="$(dirname "$GITHUB_WORKSPACE")/design-system-Lifegames"
          DS_REF=main
          if [ -n "$HEAD_REF" ] && [ "$HEAD_REF" != "main" ]; then
            if git ls-remote --exit-code "$DS_REPO_URL" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
              DS_REF="$HEAD_REF"
              echo "Using matching DS branch: $DS_REF"
            else
              echo "No matching DS branch for '$HEAD_REF'; falling back to main"
            fi
          fi
          if [ -d "$DS_DIR/.git" ]; then
            git -C "$DS_DIR" fetch --depth 1 origin "$DS_REF"
            git -C "$DS_DIR" reset --hard FETCH_HEAD
          else
            rm -rf "$DS_DIR"
            git clone --depth 1 --branch "$DS_REF" "$DS_REPO_URL" "$DS_DIR"
          fi
          ls -la "$DS_DIR" | head -5

      - uses: ./.github/actions/setup-xcode-env
        with:
          discover_simulator: 'false'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-cache-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            spm-cache-${{ runner.os }}-

      - uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f  # v1.9.2
        with:
          key: xcode-deriveddata-release-${{ runner.os }}-${{ hashFiles('**/*.pbxproj', '**/Package.resolved', '**/Package.swift', 'Development.xcconfig') }}

      - name: Archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/OfflineMediaDownloader.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee release-build.log | { xcbeautify || cat; }

      - name: Verify design-token bundle embeds in ShareExtension.appex
        run: |
          set -euo pipefail
          # LGColor reads Bundle.module. Inside an .appex that resolves against
          # the extension bundle, not the containing app, so a missing resource
          # bundle is a runtime rendering failure and not a build error. Assert
          # it here, on the real archive, or the failure only shows up on device.
          APPEX="build/OfflineMediaDownloader.xcarchive/Products/Applications/OfflineMediaDownloader.app/PlugIns/ShareExtension.appex"
          BUNDLE="$APPEX/LifegamesDesignSystem_LifegamesTokens.bundle"

          if [ ! -d "$BUNDLE" ]; then
            echo "::error::$BUNDLE is missing from the archived extension"
            find "$APPEX" -maxdepth 2 || true
            exit 1
          fi
          if [ ! -f "$BUNDLE/Assets.car" ]; then
            echo "::error::$BUNDLE has no compiled Assets.car"
            exit 1
          fi

          # Presence of the catalog is not enough — check the tokens the share
          # sheet actually reads (ShareExtension/ShareStatusView.swift).
          xcrun --sdk iphoneos assetutil --info "$BUNDLE/Assets.car" > assets-info.json
          missing=0
          for token in color-surface-base color-surface-raised color-accent-blue \
                       color-accent-green color-accent-red color-text-subtle; do
            if grep -q "\"$token\"" assets-info.json; then
              echo "found  $token"
            else
              echo "::error::$token is absent from the archived Assets.car"
              missing=1
            fi
          done
          exit "$missing"

      - name: Archive error summary
        if: failure()
        run: |
          echo "### Release Archive Errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'error:' release-build.log | head -50 >> $GITHUB_STEP_SUMMARY || echo "No error: lines found — check the raw log artifact" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload raw build log (failure only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build-log
          path: release-build.log
          retention-days: 7

  s98-preview-fixtures:
    name: S98 Preview Fixtures Scan
    runs-on: [self-hosted, linux, arm64, base]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the pinned agent-enforcement checker
        env:
          # Fine-grained PAT with Contents:Read on agent-enforcement. No
          # secrets.GITHUB_TOKEN fallback: it cannot read another private repo,
          # so the fallback only converts a missing secret into a confusing 404.
          # No runner-local $HOME checkout either — its branch is uncontrolled,
          # so the verdict would depend on where a checkout was parked.
          AE_TOKEN: ${{ secrets.AGENT_ENFORCEMENT_TOKEN }}
        run: |
          # set -e is load-bearing. The previous version ran set -uo and ended
          # its fallback with exit 0, which GitHub reads as a PASS: every run
          # from 2026-07-07 through 2026-08-27, until the
          # AGENT_ENFORCEMENT_TOKEN secret was added, took that path and the job
          # was green while scanning nothing. A missing checker must red the job.
          set -euo pipefail
          # An absent secret expands to the empty string, not an unset variable,
          # so set -u does not catch it. Without this the operator sees only a
          # bare git auth error. Fine-grained PATs expire, so this path is live.
          [ -n "${AE_TOKEN}" ] || {
            echo "::error::AGENT_ENFORCEMENT_TOKEN is missing or expired — add it in repo settings. S98 cannot run without it."
            exit 1
          }
          PIN_SHA=$(node -p "require('./.github/astgrep-pin.json').sha")
          # Re-run safe: a self-hosted runner may not have cleared RUNNER_TEMP,
          # and `git remote add` on an existing repo exits 3.
          rm -rf "$RUNNER_TEMP/ae-s98"
          git init "$RUNNER_TEMP/ae-s98"
          git -C "$RUNNER_TEMP/ae-s98" remote add origin \
            "https://x-access-token:${AE_TOKEN}@github.com/j0nathan-ll0yd/agent-enforcement.git"
          # git init + fetch --depth 1 <sha>, not clone --branch: a commit sha is
          # not a branch, so clone --branch cannot take one.
          git -C "$RUNNER_TEMP/ae-s98" fetch --depth 1 origin "$PIN_SHA"
          git -C "$RUNNER_TEMP/ae-s98" checkout FETCH_HEAD
          GOT_SHA=$(git -C "$RUNNER_TEMP/ae-s98" rev-parse HEAD)
          [ "$GOT_SHA" = "$PIN_SHA" ] || {
            echo "::error::checked out $GOT_SHA, expected $PIN_SHA"
            exit 1
          }
          echo "Obtained the checker at agent-enforcement $PIN_SHA."

      # No `if:` guard. The scan always runs when this step is reached, because
      # the fetch step above is now the fail-closed gate.
      - name: Scan Preview blocks for inline domain construction
        run: |
          set -euo pipefail
          # Run from the fetched checkout rather than a copy. The checker gates
          # its own CLI on its basename, so a renamed copy would load, match
          # nothing and exit 0 — another silent green.
          node "$RUNNER_TEMP/ae-s98/home/.claude/hooks/lib/preview-fixtures-check.mjs" --scan .

  swift-conventions:
    name: Swift Conventions (ast-grep)
    # atlas decision 0084. ast-grep parses Swift with tree-sitter, so this lane
    # needs no Xcode, no simulator and no toolchain.
    runs-on: [self-hosted, linux, arm64, base]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the pinned rule set
        env:
          # Fine-grained PAT with Contents:Read on agent-enforcement. No
          # secrets.GITHUB_TOKEN fallback: it cannot read another private repo,
          # so the fallback only converts a missing secret into a confusing 404.
          # No runner-local $HOME checkout either — its branch is uncontrolled.
          AE_TOKEN: ${{ secrets.AGENT_ENFORCEMENT_TOKEN }}
        run: |
          # set -e is load-bearing: without it a failed fetch would continue to
          # the next command. A fetch failure, a sha mismatch or an unreadable
          # version must exit non-zero. 0084 rejects an exit 0 skip.
          set -euo pipefail
          PIN_SHA=$(node -p "require('./.github/astgrep-pin.json').sha")
          git init "$RUNNER_TEMP/ae"
          git -C "$RUNNER_TEMP/ae" remote add origin \
            "https://x-access-token:${AE_TOKEN}@github.com/j0nathan-ll0yd/agent-enforcement.git"
          # git init + fetch --depth 1 <sha>, not clone --branch: a commit sha is
          # not a branch, so clone --branch cannot take one.
          git -C "$RUNNER_TEMP/ae" fetch --depth 1 origin "$PIN_SHA"
          git -C "$RUNNER_TEMP/ae" checkout FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/ae" rev-parse HEAD)" = "$PIN_SHA"
          # The engine version comes from the fetched checkout, so one pin
          # governs both the rules and the ast-grep version that runs them.
          SG_VERSION=$(node -p \
            "require('$RUNNER_TEMP/ae/astgrep-rules/package.json').devDependencies['@ast-grep/cli']")
          echo "SG_VERSION=$SG_VERSION" >> "$GITHUB_ENV"

      # A2b exact-step binding (atlas audits/gate-can-fail-campaign.md)
      - name: Swift Conventions (ast-grep)
        run: |
          set -euo pipefail
          # --package= is required, not stylistic: the package ships bins sg and
          # ast-grep, neither matching the package name, so the bare form fails
          # with "could not determine executable to run".
          # No --error flag: ast-grep scan already exits 1 on any error-severity
          # finding and 0 otherwise, so s52 (warning) stays non-blocking.
          npx --yes --package="@ast-grep/cli@${SG_VERSION}" ast-grep scan \
            --config "$RUNNER_TEMP/ae/astgrep-rules/sgconfig.yml" \
            --report-style rich \
            .
